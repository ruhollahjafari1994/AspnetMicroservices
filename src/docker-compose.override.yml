version: '3.4'

services:
  catalogdb:
    container_name: catalogdb
    restart: always
    ports:
        - "27017:27017"
    volumes:
        - mongo_data:/data/db

  basketdb:
    container_name: basketdb
    restart: always    
    ports:
        - "6379:6379"

  discountdb:
    container_name: discountdb
    environment:
      - POSTGRES_USER=${DISCOUNT_DB_USER:?Set DISCOUNT_DB_USER in .env}
      - POSTGRES_PASSWORD=${DISCOUNT_DB_PASSWORD:?Set DISCOUNT_DB_PASSWORD in .env}
      - POSTGRES_DB=DiscountDb
    restart: always
    ports:
        - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  orderdb:
    container_name: orderdb
    environment:
        SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
        ACCEPT_EULA: "Y"
    restart: always

  identity.api:
    container_name: identity.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - Identity__Issuer=http://identity.api/
      - "ConnectionStrings:IdentityConnectionString=Server=orderdb;Database=IdentityDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      - Identity__WebClientSecret=${WEB_OIDC_CLIENT_SECRET:?Set WEB_OIDC_CLIENT_SECRET in .env}
      - Identity__BasketClientSecret=${BASKET_OIDC_CLIENT_SECRET:?Set BASKET_OIDC_CLIENT_SECRET in .env}
      - Identity__BootstrapAdmin__UserName=${IDENTITY_BOOTSTRAP_ADMIN_USERNAME:-}
      - Identity__BootstrapAdmin__Password=${IDENTITY_BOOTSTRAP_ADMIN_PASSWORD:-}
      - Identity__BootstrapAdmin__Email=${IDENTITY_BOOTSTRAP_ADMIN_EMAIL:-}
    depends_on:
      - orderdb
    ports:
      - "8009:80"

  rabbitmq:
    container_name: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    restart: always
    ports:
        - "5672:5672"
        - "15672:15672"

  pgadmin:
    container_name: pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:?Set PGADMIN_EMAIL in .env}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .env}
    restart: always
    ports:
        - "5050:80"
    volumes:
      - pgadmin_data:/root/.pgadmin

  portainer:
    container_name: portainer
    restart: always
    ports:
      - "8080:8000"
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  catalog.api:
    container_name: catalog.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - "DatabaseSettings:ConnectionString=mongodb://catalogdb:27017"
      - "ElasticConfiguration:Uri=http://elasticsearch:9200"
      - Identity__Authority=http://identity.api/
      - Identity__RequireHttpsMetadata=false
      - Identity__Audience=ecommerce_api
    depends_on:
      - catalogdb
    ports:
      - "8000:80"

  basket.api:
    container_name: basket.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - "ConnectionStrings__BasketMessagingConnectionString=Server=orderdb;Database=BasketMessagingDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      - "CacheSettings:ConnectionString=basketdb:6379"
      - "CatalogSettings:Url=http://catalog.api"
      - "GrpcSettings:DiscountUrl=http://discount.grpc"
      - "EventBusSettings:HostAddress=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      - "ElasticConfiguration:Uri=http://elasticsearch:9200"
      - Identity__Authority=http://identity.api/
      - Identity__RequireHttpsMetadata=false
      - Identity__Audience=ecommerce_api
    depends_on:
      - basketdb
      - rabbitmq
      - orderdb
    ports:
      - "8001:80"

  discount.api:
    container_name: discount.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - "DatabaseSettings:ConnectionString=Server=discountdb;Port=5432;Database=DiscountDb;User Id=${DISCOUNT_DB_USER};Password=${DISCOUNT_DB_PASSWORD};"
      - "ElasticConfiguration:Uri=http://elasticsearch:9200"
      - Identity__Authority=http://identity.api/
      - Identity__RequireHttpsMetadata=false
      - Identity__Audience=ecommerce_api
    depends_on:
      - discountdb
    ports:
      - "8002:80"

  discount.grpc:
    container_name: discount.grpc
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - "DatabaseSettings:ConnectionString=Server=discountdb;Port=5432;Database=DiscountDb;User Id=${DISCOUNT_DB_USER};Password=${DISCOUNT_DB_PASSWORD};"
      - "ElasticConfiguration:Uri=http://elasticsearch:9200"
    depends_on:
      - discountdb
    ports:
      - "8003:80"
  
  ordering.api:
    container_name: ordering.api
    environment:
        - ASPNETCORE_ENVIRONMENT=Development
        - ASPNETCORE_URLS=http://+:80
        - "ConnectionStrings:OrderingConnectionString=Server=orderdb;Database=OrderDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
        - "EventBusSettings:HostAddress=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
        - "ElasticConfiguration:Uri=http://elasticsearch:9200"
        - Identity__Authority=http://identity.api/
        - Identity__RequireHttpsMetadata=false
        - Identity__Audience=ecommerce_api
    depends_on:
        - orderdb
        - rabbitmq
    ports:
        - "8004:80"

  ocelotapigw:
    container_name: ocelotapigw
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - "ElasticConfiguration:Uri=http://elasticsearch:9200"
    depends_on:
        - catalog.api
        - basket.api
        - discount.api
        - ordering.api
    ports:
      - "8010:80"

  shopping.aggregator:
    container_name: shopping.aggregator
    environment:
        - ASPNETCORE_ENVIRONMENT=Development
        - ASPNETCORE_URLS=http://+:80
        - "ApiSettings:CatalogUrl=http://catalog.api"
        - "ApiSettings:BasketUrl=http://basket.api"
        - "ApiSettings:OrderingUrl=http://ordering.api"
        - "ElasticConfiguration:Uri=http://elasticsearch:9200"
        - Identity__Authority=http://identity.api/
        - Identity__RequireHttpsMetadata=false
        - Identity__Audience=ecommerce_api
    depends_on:
        - catalog.api
        - basket.api
        - ordering.api
    ports:
        - "8005:80"

  aspnetrunbasics:
    container_name: aspnetrunbasics
    environment:
        - ASPNETCORE_ENVIRONMENT=Development
        - ASPNETCORE_URLS=http://+:80
        - "ApiSettings:GatewayAddress=http://ocelotapigw"
        - "ElasticConfiguration:Uri=http://elasticsearch:9200"
        - Identity__Authority=http://identity.api/
        - Identity__RequireHttpsMetadata=false
        - Identity__Audience=ecommerce_api
        - Identity__Issuer=http://identity.api/
        - Identity__ClientId=aspnetrun-web
        - Identity__ClientSecret=${WEB_OIDC_CLIENT_SECRET:?Set WEB_OIDC_CLIENT_SECRET in .env}
        - Identity__PublicAuthority=http://localhost:8009
    depends_on:
        - identity.api
        - ocelotapigw
        - catalog.api
        - basket.api
        - discount.api
        - ordering.api
    ports:
        - "8006:80"

  elasticsearch:
    container_name: elasticsearch
    environment:
        - xpack.monitoring.enabled=true
        - xpack.watcher.enabled=false
        - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
        - discovery.type=single-node
    ports:
        - "9200:9200"
    volumes:
        - elasticsearch-data:/usr/share/elasticsearch/data   

  kibana:
    container_name: kibana
    environment:        
        - ELASTICSEARCH_URL=http://elasticsearch:9200
    depends_on:
        - elasticsearch
    ports:
        - "5601:5601"  
        
  webstatus:
    container_name: webstatus
    environment:
        - ASPNETCORE_ENVIRONMENT=Development
        - ASPNETCORE_URLS=http://+:80
        - HealthChecksUI__HealthChecks__0__Name=Catalog Health Check
        - HealthChecksUI__HealthChecks__0__Uri=http://catalog.api/hc
        - HealthChecksUI__HealthChecks__1__Name=Basket Health Check
        - HealthChecksUI__HealthChecks__1__Uri=http://basket.api/hc
        - HealthChecksUI__HealthChecks__2__Name=Discount Health Check
        - HealthChecksUI__HealthChecks__2__Uri=http://discount.api/hc
        - HealthChecksUI__HealthChecks__3__Name=Ordering Health Check
        - HealthChecksUI__HealthChecks__3__Uri=http://ordering.api/hc
        - HealthChecksUI__HealthChecks__4__Name=Shopping Aggregator Health Check
        - HealthChecksUI__HealthChecks__4__Uri=http://shopping.aggregator/hc
        - HealthChecksUI__HealthChecks__5__Name=AspnetRunBasics WebMVC Health Check
        - HealthChecksUI__HealthChecks__5__Uri=http://aspnetrunbasics/hc    
    ports:
        - "8007:80"

